name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for accurate diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadow JAR
        run: ./gradlew :cli-app:shadowJar

      # Cache the RAG knowledge base keyed on source and doc file hashes.
      # A cache hit means the index is already at ~/.llmchat/knowledge-base.db.
      # A cache miss triggers --build-index inside the review step below.
      - name: Restore RAG knowledge base cache
        id: rag-cache
        uses: actions/cache@v4
        with:
          path: ~/.llmchat/knowledge-base.db
          key: rag-index-${{ hashFiles('**/*.kt', '**/*.md', '**/*.txt') }}

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > /tmp/pr-diff.patch

      - name: Run AI review
        id: ai_review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RAG_CACHE_HIT: ${{ steps.rag-cache.outputs.cache-hit }}
        run: |
          # Pass --build-index when the cache missed so the headless mode builds
          # the index on-the-fly before performing the review.
          BUILD_INDEX_ARG=""
          if [ "$RAG_CACHE_HIT" != "true" ]; then
            BUILD_INDEX_ARG="--build-index ."
          fi

          java -jar cli-app/build/libs/cli-app-1.0-SNAPSHOT-all.jar \
            --headless \
            --diff-file /tmp/pr-diff.patch \
            --rag \
            --temperature 0.1 \
            $BUILD_INDEX_ARG \
            2>/tmp/review-stderr.log \
            > /tmp/review-output.md

          EXIT_CODE=$?
          cat /tmp/review-stderr.log >&2
          exit $EXIT_CODE

      - name: Post PR review comment
        if: always() && steps.ai_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## AI Code Review"
            echo ""
            cat /tmp/review-output.md
            echo ""
            echo "---"
            echo "*Generated by the LLM Chat CLI agent with RAG context.*"
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Upload review artifact
        if: always() && steps.ai_review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.number }}
          path: /tmp/review-output.md
          retention-days: 30
